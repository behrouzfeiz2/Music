name: Android CI

on:
  workflow_dispatch:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Lint Android
        run: ./gradlew lint

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Setup signing
        if: github.event_name != 'pull_request'
        env:
          SIGNING_KEYSTORE_GITHUB: ${{ secrets.SIGNING_KEYSTORE_GITHUB }}
          SIGNING_PROPERTIES_GITHUB: ${{ secrets.SIGNING_PROPERTIES_GITHUB }}
        run: |
          test -n "$SIGNING_KEYSTORE_GITHUB" || { echo "Missing SIGNING_KEYSTORE_GITHUB secret"; exit 1; }
          test -n "$SIGNING_PROPERTIES_GITHUB" || { echo "Missing SIGNING_PROPERTIES_GITHUB secret"; exit 1; }
          ./ci_signing_setup.sh
          test -s retro.keystore
          test -s retro.properties
      - name: Build
        run: ./gradlew app:assemble
      - uses: actions/upload-artifact@v4
        with:
          name: fdroid-release-apk
          path: app/build/outputs/apk/fdroid/release/app-fdroid-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: normal-release-apk
          path: app/build/outputs/apk/normal/release/app-normal-release.apk
