name: Android CI

on:
  workflow_dispatch:
  push:
    branches: [ dev, main ]
  pull_request:
    branches: [ dev, main ]

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
      SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Lint Android
        run: ./gradlew lint

  build:
    runs-on: ubuntu-latest
    env:
      SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
      SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
      SIGNING_KEYSTORE_GITHUB: ${{ secrets.SIGNING_KEYSTORE_GITHUB }}
      SIGNING_PROPERTIES_GITHUB: ${{ secrets.SIGNING_PROPERTIES_GITHUB }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Setup stable APK signing
        run: |
          ./ci_signing_setup.sh
          test -s retro.keystore && test -s retro.properties || { echo "Configure SIGNING_KEYSTORE_GITHUB and SIGNING_PROPERTIES_GITHUB repository secrets before building distributable APKs."; exit 1; }
      - name: Compile debug variants
        run: ./gradlew :app:compileNormalDebugKotlin :app:compileFdroidDebugKotlin
      - name: Build release APKs
        run: ./gradlew :app:assembleNormalRelease :app:assembleFdroidRelease
      - uses: actions/upload-artifact@v4
        with:
          name: fdroid-release-apk
          path: app/build/outputs/apk/fdroid/release/app-fdroid-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: normal-release-apk
          path: app/build/outputs/apk/normal/release/app-normal-release.apk
